# Configuración de Cloudflare Pages / wrangler.
#
# El sitio se construye con Astro a ./dist y las funciones viven en ./functions.
# El formulario "recibe avisos" (functions/api/subscribe.ts) necesita un KV
# namespace con el binding SUBSCRIBERS.
#
#   1. Crea el namespace:   npx wrangler kv namespace create SUBSCRIBERS
#   2. Pega el id que devuelve en `id` (abajo) y en `preview_id`.
#   3. En producción (Pages) añade el mismo binding en:
#      Pages → tu proyecto → Settings → Functions → KV namespace bindings.
#
# Desarrollo local con funciones:  npx wrangler pages dev -- npm run dev

name = "music-mp3-downloader-page"
compatibility_date = "2024-11-01"
pages_build_output_dir = "dist"

[[kv_namespaces]]
binding = "SUBSCRIBERS"
id = "REEMPLAZA_CON_TU_KV_NAMESPACE_ID"
preview_id = "REEMPLAZA_CON_TU_KV_NAMESPACE_ID"
